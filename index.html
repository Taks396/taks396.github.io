<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Comments</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    textarea { height: 100px; }
    .comment-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; position: relative; }
    .comment-author { font-weight: bold; margin-bottom: 5px; }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Feedback Section</h2>
  
  <!-- Netlify Forms tracking form -->
  <form id="commentForm" name="site-feedback" action="/" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="site-feedback" />
    <input type="hidden" name="comment_id" id="commentId" />
    <input type="hidden" name="delete_token" id="deleteToken" />
    
    <input type="text" name="name" id="nameInput" placeholder="Anonymous" />
    <textarea name="comment" id="commentInput" placeholder="Leave your feedback..." required></textarea>
    <button type="submit">Post Comment</button>
  </form>

  <h3>Comments</h3>
  <div id="commentsDisplay">Loading comments...</div>

  <script>
    const form = document.getElementById('commentForm');
    const commentsDisplay = document.getElementById('commentsDisplay');

    // 1. Generate unique IDs for ownership tracking
    function prepareTokens() {
      const cryptoId = crypto.randomUUID();
      const cryptoToken = crypto.randomUUID();
      document.getElementById('commentId').value = cryptoId;
      document.getElementById('deleteToken').value = cryptoToken;
      return { cryptoId, cryptoToken };
    }

    // 2. Submit Comment via AJAX so page doesn't refresh brutally
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { cryptoId, cryptoToken } = prepareTokens();
      
      const formData = new FormData(form);
      if(!formData.get('name')) formData.set('name', 'Anonymous');

      try {
        await fetch('/', {
          method: 'POST',
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString()
        });

        // Save local keys to browser memory
        const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
        localOwnership[cryptoId] = cryptoToken;
        localStorage.setItem('my_comments', JSON.stringify(localOwnership));

        // Reset and reload
        form.reset();
        loadComments();
      } catch (err) {
        alert('Failed to post comment.');
      }
    });

    // 3. Fetch comments from Serverless Function and display them
    async function loadComments() {
      try {
        const res = await fetch('/api/get-comments');
        const comments = await res.json();
        const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
        
        if (comments.length === 0) {
          commentsDisplay.innerHTML = '<p>No comments yet. Be the first!</p>';
          return;
        }

        commentsDisplay.innerHTML = comments.map(c => {
          // Check if this browser created this comment ID
          const hasDeleteRights = localOwnership[c.id] !== undefined;
          return `
            <div class="comment-card">
              <div class="comment-author">${c.name}</div>
              <p>${c.message}</p>
              ${hasDeleteRights ? `<button class="delete-btn" onclick="deleteComment('${c.submission_id}', '${c.id}')">Delete</button>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        commentsDisplay.innerHTML = '<p>Could not load comments.</p>';
      }
    }

    // 4. Request deletion via API
    window.deleteComment = async (submissionId, commentId) => {
      if (!confirm('Are you sure you want to delete your comment?')) return;
      
      const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
      const token = localOwnership[commentId];

      try {
        const res = await fetch('/api/delete-comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ submissionId, commentId, token })
        });

        if (res.ok) {
          delete localOwnership[commentId];
          localStorage.setItem('my_comments', JSON.stringify(localOwnership));
          loadComments();
        } else {
          alert('Failed to delete comment.');
        }
      } catch (err) {
        alert('An error occurred.');
      }
    };

    // Initial load
    loadComments();
  </script>
</body>
</html>
