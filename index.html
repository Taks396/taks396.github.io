<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Comments</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    textarea { height: 100px; }
    .comment-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; position: relative; }
    .comment-author { font-weight: bold; margin-bottom: 5px; }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Feedback Section</h2>
  
  <!-- Netlify Forms tracking form -->
  <form id="commentForm" name="site-feedback" action="/" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="site-feedback" />
    <input type="hidden" name="comment_id" id="commentId" />
    <input type="hidden" name="delete_token" id="deleteToken" />
    <!-- Add this line to track edits -->
    <input type="hidden" name="edited_id" id="editedId" value="" />
    
    <input type="text" name="name" id="nameInput" placeholder="Anonymous" />
    <textarea name="comment" id="commentInput" placeholder="Leave your feedback..." required></textarea>
    <button type="submit" id="submitBtn">Post Comment</button>
    <button type="button" id="cancelEditBtn" style="display:none;" onclick="cancelEditing()">Cancel Edit</button>
  </form>


  <h3>Comments</h3>
  <div id="commentsDisplay">Loading comments...</div>

  <script>
    const form = document.getElementById('commentForm');
    const commentsDisplay = document.getElementById('commentsDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    function prepareTokens() {
      const cryptoId = crypto.randomUUID();
      const cryptoToken = crypto.randomUUID();
      document.getElementById('commentId').value = cryptoId;
      document.getElementById('deleteToken').value = cryptoToken;
      return { cryptoId, cryptoToken };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const typedName = document.getElementById('nameInput').value.trim() || 'Anonymous';
      const typedComment = document.getElementById('commentInput').value;
      const isEditing = document.getElementById('editedId').value !== "";

      let cryptoId, cryptoToken;
      
      if (isEditing) {
        // KEEP THE SAME IDENTIFIERS so the backend knows it's an overwrite
        cryptoId = document.getElementById('commentId').value;
        cryptoToken = document.getElementById('deleteToken').value;
      } else {
        // Generate fresh ones if it's a completely new post
        const tokens = prepareTokens();
        cryptoId = tokens.cryptoId;
        cryptoToken = tokens.cryptoToken;
      }
      
      const formData = new FormData(form);
      if(!formData.get('name')) formData.set('name', 'Anonymous');

      // Optimistic visual update (Shows instantly on screen)
      const instantHTML = `
        <div class="comment-card" id="temp-${cryptoId}" style="opacity: 0.6;">
          <div class="comment-author">${typedName} ${isEditing ? '(Saving edit...)' : '(Posting...)'}</div>
          <p>${typedComment}</p>
        </div>
      `;
      
      if (!isEditing && commentsDisplay.innerHTML.includes('No comments yet')) {
        commentsDisplay.innerHTML = '';
      }
      
      if (isEditing) {
        const oldCard = document.querySelector(`[data-id="${cryptoId}"]`);
        if (oldCard) oldCard.outerHTML = instantHTML;
      } else {
        commentsDisplay.insertAdjacentHTML('afterbegin', instantHTML);
      }

      try {
        // Send the post data securely to Netlify's form processing engine
        await fetch('/', {
          method: 'POST',
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString()
        });

        // Save local keys to browser memory if it's new
        if (!isEditing) {
          const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
          localOwnership[cryptoId] = cryptoToken;
          localStorage.setItem('my_comments', JSON.stringify(localOwnership));
        }

        cancelEditing(); // Safely clear out input boxes and reset form fields
        
        // Increased breathing room to 2.5 seconds to ensure Netlify completes its database write
        setTimeout(() => { loadComments(); }, 2500);
      } catch (err) {
        alert('Failed to save changes.');
        loadComments();
      }
    });

    async function loadComments() {
      try {
        const res = await fetch('/api/get-comments');
        const comments = await res.json();
        const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
        
        if (comments.length === 0) {
          commentsDisplay.innerHTML = '<p>No comments yet. Be the first!</p>';
          return;
        }

        commentsDisplay.innerHTML = comments.map(c => {
          const hasRights = localOwnership[c.id] !== undefined;
          return `
            <div class="comment-card" data-id="${c.id}">
              <div class="comment-author">${c.name}</div>
              <p class="comment-text">${c.message}</p>
              ${hasRights ? `
                <div style="position: absolute; top: 15px; right: 15px; display: flex; gap: 5px;">
                  <button onclick="startEditing('${c.submission_id}', '${c.id}', this)">Edit</button>
                  <button style="background: #ff4d4d; color: white; border: none; padding: 2px 5px; cursor: pointer;" onclick="deleteComment('${c.submission_id}', '${c.id}')">Delete</button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        commentsDisplay.innerHTML = '<p>Could not load comments.</p>';
      }
    }

    window.startEditing = (submissionId, commentId, buttonEl) => {
      const card = buttonEl.closest('.comment-card');
      const author = card.querySelector('.comment-author').innerText;
      const text = card.querySelector('.comment-text').innerText;
      const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');

      document.getElementById('commentId').value = commentId;
      document.getElementById('deleteToken').value = localOwnership[commentId];
      document.getElementById('editedId').value = submissionId; // Active flag
      
      document.getElementById('nameInput').value = author;
      document.getElementById('commentInput').value = text;
      
      submitBtn.innerText = "Save Edit";
      cancelEditBtn.style.display = "inline-block";
      document.getElementById('commentInput').focus();
    };

    window.cancelEditing = () => {
      form.reset();
      document.getElementById('editedId').value = "";
      submitBtn.innerText = "Post Comment";
      cancelEditBtn.style.display = "none";
    };

    window.deleteComment = async (submissionId, commentId) => {
      if (!confirm('Are you sure you want to delete your comment?')) return;
      const localOwnership = JSON.parse(localStorage.getItem('my_comments') || '{}');
      const token = localOwnership[commentId];
      try {
        const res = await fetch('/api/delete-comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ submissionId, commentId, token })
        });
        if (res.ok) {
          delete localOwnership[commentId];
          localStorage.setItem('my_comments', JSON.stringify(localOwnership));
          loadComments();
        } else { alert('Failed to delete.'); }
      } catch (err) { alert('An error occurred.'); }
    };

    loadComments();

  </script>
</body>
</html>
